<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Machine Asset Management</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0f172a,#1e3a8a,#0f766e);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
color:#fff
}

.card{
width:100%;
max-width:440px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.2);
border-radius:25px;
padding:30px;
box-shadow:0 20px 60px rgba(0,0,0,.3)
}

.logo{
text-align:center;
font-size:55px;
margin-bottom:5px
}

h1{
text-align:center;
margin:5px 0;
font-size:26px
}

.subtitle{
text-align:center;
opacity:.8;
margin-bottom:25px
}

label{
display:block;
margin-top:15px;
margin-bottom:7px;
font-weight:bold
}

input{
width:100%;
padding:14px;
border:0;
border-radius:12px;
font-size:16px;
outline:none
}

button{
width:100%;
padding:14px;
margin-top:20px;
border:0;
border-radius:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;
background:#22c55e;
color:#052e16
}

button:hover{
opacity:.9
}

#msg{
margin-top:15px;
text-align:center;
font-weight:bold
}

.footer{
text-align:center;
margin-top:25px;
font-size:12px;
opacity:.7
}

/* ===== MAMS PROFESSIONAL THEME ===== */
:root{--navy:#0b1220;--blue:#2563eb;--teal:#0f766e;--green:#16a34a;--amber:#d97706;--red:#dc2626;--bg:#f4f7fb;--line:#e2e8f0;--text:#0f172a;--muted:#64748b}
body{background:radial-gradient(circle at top,#eef5ff 0,#f7fafc 48%,#eef2f7 100%);color:var(--text)}
.header{background:linear-gradient(135deg,var(--navy),#123b7a 55%,var(--teal));position:relative;overflow:hidden}
.header:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;right:-110px;top:-160px;background:rgba(255,255,255,.08)}
.card,.section,.stat{border:1px solid rgba(148,163,184,.22);box-shadow:0 12px 35px rgba(15,23,42,.08);transition:.2s}
.card:hover,.section:hover{box-shadow:0 16px 42px rgba(15,23,42,.11)}
input,select,textarea{min-height:44px;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:#2563eb!important;box-shadow:0 0 0 4px rgba(37,99,235,.10)!important}
button{min-height:44px}
.save,.confirmBtn,.confirmReview{background:linear-gradient(135deg,#16a34a,#15803d)!important}
.reviewHeader{background:linear-gradient(135deg,#0f172a,#0f766e)!important}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;z-index:9999;pointer-events:none;padding:14px 20px;border-radius:14px;background:#0f172a;color:#fff;box-shadow:0 12px 35px rgba(0,0,0,.25);font-weight:700;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){.container{padding:12px!important}.header{padding:20px 14px!important}.header h1{font-size:22px!important}.card,.section{padding:16px!important}button{min-height:46px}}

</style>
</head>

<body>

<div class="card">

<div class="logo">🏭</div>

<h1>Machine Asset Management</h1>

<div class="subtitle">
Production • Maintenance • Assets
</div>

<label>👤 Username</label>
<input id="username" autocomplete="username">

<label>🔐 Password</label>
<input id="password" type="password" autocomplete="current-password">

<button onclick="login()">🚀 Login</button>

<div id="msg"></div>

<div class="footer">
Industrial Machine Asset System
</div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxop4TOck0v3KRllP6qJpNOLqpxyKAzw5YG43IP-lZEVHy_MChTn12RAdFfC_J9qysLsA/exec";


async function api(data){

const response=await fetch(API_URL,{
method:"POST",
headers:{"Content-Type":"text/plain;charset=utf-8"},
body:JSON.stringify(data),
redirect:"follow"
});

const text=await response.text();

if(!text || !text.trim()){
throw new Error("Empty response from Google Apps Script.");
}

let result;
try{result=JSON.parse(text.trim());}
catch(e){throw new Error("Invalid API response: "+text.substring(0,250));}

if(result.success===false){
throw new Error(result.message || "Request failed.");
}

return result;
}


async function login(){

const username =
document.getElementById("username").value.trim();

const password =
document.getElementById("password").value;

const msg =
document.getElementById("msg");

if(!username || !password){

msg.innerHTML =
"⚠️ Username and Password required.";

return;
}

msg.innerHTML =
"⏳ Logging in...";

try{

const result =
await api({
action:"login",
username:username,
password:password
});

if(!result.success){

msg.innerHTML =
"❌ " + result.message;

return;
}

sessionStorage.setItem(
"machine_token",
result.token
);

sessionStorage.setItem(
"machine_user",
JSON.stringify(result.user)
);

window.location.href =
"home.html";

}catch(error){

msg.innerHTML =
"❌ Connection error.";

console.error(error);
}

}

document
.getElementById("password")
.addEventListener(
"keypress",
function(e){

if(e.key==="Enter"){
login();
}

});

</script>

</body>
</html>
