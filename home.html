<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Machine Asset System</title>

<style>

*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#0f172a
}

.header{
background:linear-gradient(135deg,#0f172a,#1d4ed8);
color:white;
padding:25px;
text-align:center
}

.header h1{
margin:0
}

.user{
margin-top:8px;
opacity:.8
}

.container{
max-width:1000px;
margin:auto;
padding:25px
}

.grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));
gap:20px
}

.card{
background:white;
padding:25px;
border-radius:20px;
box-shadow:
0 8px 25px rgba(0,0,0,.08);
cursor:pointer;
transition:.2s
}

.card:hover{
transform:translateY(-4px);
box-shadow:
0 15px 35px rgba(0,0,0,.15)
}

.icon{
font-size:45px
}

.title{
font-size:20px;
font-weight:bold;
margin-top:12px
}

.desc{
color:#64748b;
margin-top:7px
}

.logout{
margin-top:25px;
background:#ef4444;
color:white;
border:0;
padding:13px 25px;
border-radius:10px;
cursor:pointer
}


/* ===== MAMS PROFESSIONAL THEME ===== */
:root{--navy:#0b1220;--blue:#2563eb;--teal:#0f766e;--green:#16a34a;--amber:#d97706;--red:#dc2626;--bg:#f4f7fb;--line:#e2e8f0;--text:#0f172a;--muted:#64748b}
body{background:radial-gradient(circle at top,#eef5ff 0,#f7fafc 48%,#eef2f7 100%);color:var(--text)}
.header{background:linear-gradient(135deg,var(--navy),#123b7a 55%,var(--teal));position:relative;overflow:hidden}
.header:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;right:-110px;top:-160px;background:rgba(255,255,255,.08)}
.card,.section,.stat{border:1px solid rgba(148,163,184,.22);box-shadow:0 12px 35px rgba(15,23,42,.08);transition:.2s}
.card:hover,.section:hover{box-shadow:0 16px 42px rgba(15,23,42,.11)}
input,select,textarea{min-height:44px;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:#2563eb!important;box-shadow:0 0 0 4px rgba(37,99,235,.10)!important}
button{min-height:44px}
.save,.confirmBtn,.confirmReview{background:linear-gradient(135deg,#16a34a,#15803d)!important}
.reviewHeader{background:linear-gradient(135deg,#0f172a,#0f766e)!important}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;z-index:9999;pointer-events:none;padding:14px 20px;border-radius:14px;background:#0f172a;color:#fff;box-shadow:0 12px 35px rgba(0,0,0,.25);font-weight:700;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){.container{padding:12px!important}.header{padding:20px 14px!important}.header h1{font-size:22px!important}.card,.section{padding:16px!important}button{min-height:46px}}

</style>
</head>

<body>

<div class="header">

<h1>🏭 Machine Asset Management</h1>

<div class="user" id="userInfo"></div>

</div>

<div class="container">

<div class="grid">

<div class="card"
id="productionCard"
onclick="location.href='production.html'">

<div class="icon">🏗️</div>

<div class="title">
Production Entry
</div>

<div class="desc">
Machine production information
</div>

</div>


<div class="card"
id="maintenanceCard"
onclick="location.href='maintenance.html'">

<div class="icon">🔧</div>

<div class="title">
Maintenance Entry
</div>

<div class="desc">
Machine technical & child assets
</div>

</div>


<div class="card"
id="dashboardCard"
onclick="location.href='dashboard.html'">

<div class="icon">📊</div>

<div class="title">
Dashboard
</div>

<div class="desc">
Machine asset overview
</div>

</div>


<div class="card"
id="adminCard"
onclick="location.href='user_management.html'">

<div class="icon">👥</div>

<div class="title">
User Management
</div>

<div class="desc">
Administrator only
</div>

</div>

</div>

<button class="logout"
onclick="logout()">
🚪 Logout
</button>

</div>

<script>

const token =
sessionStorage.getItem("machine_token");

const user =
JSON.parse(
sessionStorage.getItem("machine_user") || "null"
);

if(!token || !user){

location.href="index.html";
}

document.getElementById("userInfo").innerText =
"👤 " +
(user.displayName || user.username) +
" • " +
user.role;


if(
user.role !== "Administrator"
&& !user.production
){

document.getElementById(
"productionCard"
).style.display="none";

}


if(
user.role !== "Administrator"
&& !user.maintenance
){

document.getElementById(
"maintenanceCard"
).style.display="none";

}


if(
user.role !== "Administrator"
&& !user.dashboard
){

document.getElementById(
"dashboardCard"
).style.display="none";

}


if(
user.role !== "Administrator"
){

document.getElementById(
"adminCard"
).style.display="none";

}


async function logout(){

sessionStorage.clear();

location.href="index.html";

}

</script>

</body>
</html>
