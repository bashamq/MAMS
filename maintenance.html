<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Maintenance Technical Entry | MAMS</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:linear-gradient(135deg,#eef2ff,#f8fafc);
color:#0f172a;
min-height:100vh;
}

.header{
background:linear-gradient(135deg,#111827,#0f766e,#0d9488);
color:white;
padding:24px 20px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.header h1{
margin:0;
font-size:27px;
}

.header p{
margin:7px 0 0;
opacity:.85;
}

.container{
max-width:1050px;
margin:auto;
padding:20px;
}

.back{
background:#64748b;
color:white;
border:0;
padding:11px 18px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
margin-bottom:15px;
}

.back:hover{
background:#475569;
}

.card{
background:white;
border-radius:20px;
padding:25px;
box-shadow:0 10px 30px rgba(15,23,42,.08);
margin-bottom:20px;
}

.card h2{
margin-top:0;
margin-bottom:22px;
}

.grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));
gap:17px;
}

label{
display:block;
font-weight:bold;
margin-bottom:7px;
}

input,
select,
textarea{
width:100%;
padding:13px;
border:1px solid #cbd5e1;
border-radius:10px;
font-size:15px;
background:white;
outline:none;
}

input:focus,
select:focus,
textarea:focus{
border-color:#2563eb;
box-shadow:0 0 0 3px rgba(37,99,235,.10);
}

input[readonly]{
background:#f1f5f9;
cursor:not-allowed;
}

.required{
color:#dc2626;
}

.searchRow{
display:grid;
grid-template-columns:1fr auto;
gap:12px;
align-items:end;
}

.searchBtn{
background:#2563eb;
color:white;
border:0;
padding:13px 20px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

.searchBtn:hover{
background:#1d4ed8;
}

.searchBtn:disabled{
opacity:.6;
cursor:not-allowed;
}

.productionInfo{
background:#eff6ff;
border:1px solid #bfdbfe;
padding:16px;
border-radius:12px;
margin-top:18px;
line-height:1.8;
}

.productionTitle{
font-size:17px;
font-weight:bold;
color:#1d4ed8;
margin-bottom:8px;
}

.machineTypeBox{
margin-top:20px;
padding:18px;
background:#f8fafc;
border:1px solid #e2e8f0;
border-radius:14px;
}

.typeBadge{
display:inline-block;
padding:7px 12px;
border-radius:20px;
font-size:13px;
font-weight:bold;
margin-top:7px;
}

.cncBadge{
background:#dbeafe;
color:#1d4ed8;
}

.convBadge{
background:#fef3c7;
color:#92400e;
}

.hidden{
display:none !important;
}

.childSection{
border:2px solid #dbeafe;
background:#f8fbff;
padding:20px;
border-radius:16px;
margin-top:20px;
}

.childSection.requiredChild{
border:2px solid #ef4444;
background:#fff7f7;
}

.childHeader{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-bottom:15px;
}

.childTitle{
font-size:19px;
font-weight:bold;
}

.requiredNotice{
color:#dc2626;
font-size:13px;
font-weight:bold;
}

.child{
border:1px solid #cbd5e1;
background:white;
padding:18px;
border-radius:14px;
margin-top:15px;
position:relative;
box-shadow:0 4px 12px rgba(15,23,42,.05);
}

.childTitleSmall{
font-weight:bold;
font-size:16px;
margin-bottom:15px;
color:#334155;
}

.remove{
background:#ef4444;
color:white;
border:0;
padding:8px 12px;
border-radius:8px;
position:absolute;
right:15px;
top:15px;
cursor:pointer;
}

.remove:hover{
background:#dc2626;
}

.add{
background:#2563eb;
color:white;
border:0;
padding:13px 18px;
border-radius:10px;
margin-top:15px;
font-weight:bold;
cursor:pointer;
}

.add:hover{
background:#1d4ed8;
}

.save{
background:linear-gradient(135deg,#16a34a,#15803d);
color:white;
border:0;
padding:16px;
border-radius:12px;
width:100%;
font-size:17px;
font-weight:bold;
cursor:pointer;
box-shadow:0 6px 15px rgba(22,163,74,.2);
}

.save:hover{
transform:translateY(-1px);
}

#msg{
text-align:center;
font-weight:bold;
margin:17px 0;
min-height:24px;
}

.success{
color:#15803d;
}

.error{
color:#dc2626;
}

.empty{
color:#64748b;
font-style:italic;
}

@media(max-width:600px){

.container{
padding:12px;
}

.card{
padding:18px;
border-radius:15px;
}

.header h1{
font-size:22px;
}

.searchRow{
grid-template-columns:1fr;
}

.grid{
grid-template-columns:1fr;
}

.childHeader{
align-items:flex-start;
flex-direction:column;
}

}

</style>

</head>

<body>

<div class="header">

<h1>🔧 Maintenance Technical Entry</h1>

<p>Machine Asset Management System</p>

</div>


<div class="container">

<button
class="back"
onclick="location.href='home.html'">

⬅️ Back to Home

</button>


<!-- ==================================================
     ASSET SEARCH
================================================== -->

<div class="card">

<h2>🔎 Find Machine</h2>

<div class="searchRow">

<div>

<label>
Asset Number <span class="required">*</span>
</label>

<input
id="searchAsset"
placeholder="Enter Asset Number"
autocomplete="off">

</div>

<button
id="loadBtn"
class="searchBtn"
onclick="loadMachine()">

🔍 Load Machine

</button>

</div>

<div
id="productionInfo"
class="productionInfo hidden">
</div>

</div>


<!-- ==================================================
     MACHINE TYPE
================================================== -->

<div
id="typeCard"
class="card hidden">

<h2>⚙️ Machine Type</h2>

<div class="grid">

<div>

<label>
Machine Type <span class="required">*</span>
</label>

<select
id="machineType"
onchange="machineTypeChanged()">

<option value="">
Select Machine Type
</option>

<option value="CNC">
CNC
</option>

<option value="Conventional">
Conventional
</option>

</select>

</div>

<div>

<label>Asset Number</label>

<input
id="assetNumber"
readonly>

</div>

</div>

</div>


<!-- ==================================================
     MACHINE TECHNICAL INFORMATION
================================================== -->

<div
id="machineCard"
class="card hidden">

<h2>⚙️ Machine Technical Information</h2>

<div class="grid">


<!-- COMMON -->

<div>

<label>
Machine Name <span class="required">*</span>
</label>

<input
id="machineName"
placeholder="Enter Machine Name">

</div>


<div>

<label>
Manufacturer <span class="required">*</span>
</label>

<input
id="manufacturer"
placeholder="Enter Manufacturer">

</div>


<!-- CNC ONLY -->

<div
id="yearField"
class="hidden">

<label>
Year <span class="required">*</span>
</label>

<input
id="year"
type="number"
placeholder="Enter Year">

</div>


<div
id="controllerField"
class="hidden">

<label>
Controller <span class="required">*</span>
</label>

<input
id="controller"
placeholder="Enter Controller">

</div>


<div
id="cncControlField"
class="hidden">

<label>
CNC Control <span class="required">*</span>
</label>

<input
id="cncControl"
placeholder="Enter CNC Control">

</div>


<!-- COMMON POWER -->

<div>

<label>
Power Rating <span class="required">*</span>
</label>

<input
id="powerRating"
placeholder="e.g. 15 kW">

</div>


<div>

<label>
Voltage <span class="required">*</span>
</label>

<input
id="voltage"
placeholder="e.g. 400 V">

</div>


<!-- CNC ONLY -->

<div
id="serialField"
class="hidden">

<label>
Serial Number <span class="required">*</span>
</label>

<input
id="serialNumber"
placeholder="Enter Serial Number">

</div>


<!-- PRODUCTION DATA -->

<div>

<label>
Department / Production Line
</label>

<input
id="departmentProductionLine"
readonly
placeholder="Loaded from Production Data">

</div>

</div>

</div>


<!-- ==================================================
     CHILD ASSETS
================================================== -->

<div
id="childSection"
class="childSection hidden">

<div class="childHeader">

<div>

<div class="childTitle">
🔩 Child Assets
</div>

<div
id="childNotice"
class="requiredNotice">
</div>

</div>

</div>


<div id="children"></div>


<button
class="add"
onclick="addChild()">

➕ Add Child Asset

</button>

</div>


<!-- ==================================================
     SAVE
================================================== -->

<div
id="saveArea"
class="hidden">

<button
class="save"
onclick="saveMaintenance()">

💾 Save Machine Data

</button>

</div>


<div id="msg"></div>

</div>


<script>

/* ==================================================
   API URL
================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbxop4TOck0v3KRllP6qJpNOLqpxyKAzw5YG43IP-lZEVHy_MChTn12RAdFfC_J9qysLsA/exec";


/* ==================================================
   LOGIN
================================================== */

const token =
sessionStorage.getItem("machine_token");

const user =
JSON.parse(
sessionStorage.getItem("machine_user") || "null"
);


if(
!token ||
!user ||
(
!user.maintenance &&
user.role !== "Administrator"
)
){

location.href="index.html";

}


/* ==================================================
   CURRENT PRODUCTION DATA
================================================== */

let productionData = [];

let currentMachineLoaded = false;


/* ==================================================
   API
================================================== */

async function api(data){

const response =
await fetch(
API_URL,
{
method:"POST",

headers:{
"Content-Type":
"text/plain;charset=utf-8"
},

body:JSON.stringify(data),

redirect:"follow"

}
);

if(!response.ok){

throw new Error(
"HTTP Error: " +
response.status
);

}

const text =
await response.text();

console.log(
"API Response:",
text
);

try{

return JSON.parse(text);

}catch(e){

throw new Error(
"Invalid API response"
);

}

}


/* ==================================================
   LOAD MACHINE
================================================== */

async function loadMachine(){

const asset =
document.getElementById(
"searchAsset"
).value.trim();


if(!asset){

alert(
"⚠️ Please enter Asset Number."
);

return;

}


const btn =
document.getElementById(
"loadBtn"
);

btn.disabled=true;

btn.innerText=
"⏳ Loading...";


document.getElementById(
"msg"
).innerHTML=
"⏳ Loading machine data...";


try{

const result =
await api({

action:"getMachine",

token:token,

assetNumber:asset

});


console.log(
"Machine Result:",
result
);


if(!result.success){

throw new Error(
result.message ||
"Machine not found."
);

}


currentMachineLoaded=true;

productionData =
result.production || [];


/* Asset */

document.getElementById(
"assetNumber"
).value=asset;


/* Show cards */

document.getElementById(
"typeCard"
).classList.remove("hidden");

document.getElementById(
"machineCard"
).classList.remove("hidden");

document.getElementById(
"childSection"
).classList.remove("hidden");

document.getElementById(
"saveArea"
).classList.remove("hidden");


/* Production */

showProductionData(
productionData
);


/* Existing machine data */

if(result.machine){

fillMachine(
result.machine
);

}


/* Department / Production Line */

loadProductionLine(
productionData
);


/* Existing children */

document.getElementById(
"children"
).innerHTML="";


if(
result.children &&
result.children.length
){

result.children.forEach(
child=>addChild(child)
);

}


/* Existing machine type */

if(
result.machine &&
result.machine.machineType
){

document.getElementById(
"machineType"
).value=
result.machine.machineType;

machineTypeChanged();

}


/* If no type saved */

if(
!document.getElementById(
"machineType"
).value
){

document.getElementById(
"machineType"
).value="";

}


document.getElementById(
"msg"
).innerHTML=
"✅ Machine loaded successfully.";


window.scrollTo({
top:0,
behavior:"smooth"
});


}catch(error){

console.error(
"Load Machine Error:",
error
);

document.getElementById(
"msg"
).innerHTML=
"❌ " +
(error.message ||
"Connection error. Please check API connection.");

}finally{

btn.disabled=false;

btn.innerText=
"🔍 Load Machine";

}

}


/* ==================================================
   PRODUCTION INFORMATION
================================================== */

function showProductionData(data){

const box =
document.getElementById(
"productionInfo"
);

box.classList.remove(
"hidden"
);


if(!data || !data.length){

box.innerHTML=`

<div class="productionTitle">
🏭 Production Information
</div>

<div class="empty">
No Production Data Found
</div>

`;

return;

}


let html=`

<div class="productionTitle">
🏭 Production Information
</div>
`;


data.forEach(p=>{

html+=`

<div>

<b>Machine Shop:</b>
${escapeHtml(p.machineShop || "-")}

<br>

<b>Production Line:</b>
${escapeHtml(p.productionLine || "-")}

<br>

<b>Process Location:</b>
${escapeHtml(p.machineLocation || "-")}

<br>

<b>Part:</b>
${escapeHtml(p.partName || "-")}

<br>

<b>Operation:</b>
${escapeHtml(p.operationProcess || "-")}

<br>

<b>CT:</b>
${escapeHtml(p.ctCycleTime || "-")}

<br>

<b>Status:</b>
${escapeHtml(p.machineStatus || "-")}

</div>

<hr>

`;

});


box.innerHTML=html;

}


/* ==================================================
   PRODUCTION LINE
================================================== */

function loadProductionLine(data){

if(!data || !data.length){

document.getElementById(
"departmentProductionLine"
).value="";

return;

}


const lines =
[...new Set(
data
.map(p=>p.productionLine)
.filter(Boolean)
)];


document.getElementById(
"departmentProductionLine"
).value=
lines.join(" | ");

}


/* ==================================================
   FILL EXISTING MACHINE
================================================== */

function fillMachine(m){

setVal(
"machineName",
m.machineName
);

setVal(
"manufacturer",
m.manufacturer
);

setVal(
"year",
m.year
);

setVal(
"controller",
m.controller
);

setVal(
"cncControl",
m.cncControl
);

setVal(
"powerRating",
m.powerRating
);

setVal(
"voltage",
m.voltage
);

setVal(
"serialNumber",
m.serialNumber
);

}


/* ==================================================
   MACHINE TYPE CHANGE
================================================== */

function machineTypeChanged(){

const type =
document.getElementById(
"machineType"
).value;


/* Reset visibility */

document.getElementById(
"yearField"
).classList.add("hidden");

document.getElementById(
"controllerField"
).classList.add("hidden");

document.getElementById(
"cncControlField"
).classList.add("hidden");

document.getElementById(
"serialField"
).classList.add("hidden");


const machineCard =
document.getElementById(
"machineCard"
);


if(type==="CNC"){

document.getElementById(
"yearField"
).classList.remove("hidden");

document.getElementById(
"controllerField"
).classList.remove("hidden");

document.getElementById(
"cncControlField"
).classList.remove("hidden");

document.getElementById(
"serialField"
).classList.remove("hidden");


document.getElementById(
"childSection"
).classList.add(
"requiredChild"
);

document.getElementById(
"childNotice"
).innerText=
"Child Asset entry is required for CNC machines.";

}


else if(type==="Conventional"){

document.getElementById(
"childSection"
).classList.add(
"requiredChild"
);

document.getElementById(
"childNotice"
).innerText=
"Motor entry is required for Conventional machines.";

}


else{

document.getElementById(
"childSection"
).classList.remove(
"requiredChild"
);

document.getElementById(
"childNotice"
).innerText="";

}


/* Update existing child dropdowns */

document
.querySelectorAll(".child")
.forEach(
div=>{

updateChildOptions(
div,
div.dataset.type || ""
);

});

}


/* ==================================================
   ADD CHILD ASSET
================================================== */

function addChild(data={}){

const type =
document.getElementById(
"machineType"
).value;


if(!type){

alert(
"Please select Machine Type first."
);

return;

}


const container =
document.getElementById(
"children"
);


const div =
document.createElement("div");

div.className="child";


div.dataset.type =
data.childAssetType || "";


div.innerHTML=`

<button
class="remove"
type="button"
onclick="this.parentElement.remove()">

✖

</button>


<div class="childTitleSmall">

Child Asset

</div>


<div class="grid">


<div>

<label>
Child Asset Type
<span class="required">*</span>
</label>

<select
class="childType"
onchange="childTypeChanged(this)">

</select>

</div>


<div>

<label>
Child Asset Name
<span class="required">*</span>
</label>

<select
class="childName"
onchange="childNameChanged(this)">

</select>

</div>


<div
class="axisField hidden">

<label>
Axis
<span class="required">*</span>
</label>

<select class="childAxis">

<option value="">
Select Axis
</option>

<option value="X Axis">
X Axis
</option>

<option value="Y Axis">
Y Axis
</option>

<option value="Z Axis">
Z Axis
</option>

<option value="4th Axis">
4th Axis
</option>

<option value="5th Axis">
5th Axis
</option>

</select>

</div>

</div>

`;


container.appendChild(div);


updateChildOptions(
div,
data.childAssetType || "",
data.childAssetName || "",
data.axis || ""
);

}


/* ==================================================
   CHILD TYPE OPTIONS
================================================== */

function updateChildOptions(
div,
selectedType="",
selectedName="",
selectedAxis=""
){

const machineType =
document.getElementById(
"machineType"
).value;


const typeSelect =
div.querySelector(
".childType"
);


const nameSelect =
div.querySelector(
".childName"
);


typeSelect.innerHTML="";


if(machineType==="CNC"){

typeSelect.innerHTML=`

<option value="">
Select Type
</option>

<option value="Motor">
Motor
</option>

<option value="Drive">
Drive
</option>

`;

}


else if(
machineType==="Conventional"
){

typeSelect.innerHTML=`

<option value="">
Select Type
</option>

<option value="Motor">
Motor
</option>

`;

}


if(selectedType){

typeSelect.value=
selectedType;

}


/* Names */

updateChildNames(
div,
selectedName
);


/* Axis */

const axis =
div.querySelector(
".axisField"
);

if(selectedAxis){

div.querySelector(
".childAxis"
).value=
selectedAxis;

}

}


/* ==================================================
   CHILD NAME OPTIONS
================================================== */

function updateChildNames(
div,
selectedName=""
){

const machineType =
document.getElementById(
"machineType"
).value;


const type =
div.querySelector(
".childType"
).value;


const nameSelect =
div.querySelector(
".childName"
);


nameSelect.innerHTML=`

<option value="">
Select Name
</option>

`;


if(machineType==="CNC"){

if(type==="Motor" || type==="Drive"){

nameSelect.innerHTML+=`

<option value="Spindle">
Spindle
</option>

<option value="Axis">
Axis
</option>

<option value="ATC / Tool Turret">
ATC / Tool Turret
</option>

`;

}

}


if(
machineType==="Conventional" &&
type==="Motor"
){

nameSelect.innerHTML+=`

<option value="Spindle">
Spindle
</option>

<option value="Feed / Slide">
Feed / Slide
</option>

`;

}


if(selectedName){

nameSelect.value=
selectedName;

}


childNameChanged(
nameSelect
);

}


/* ==================================================
   CHILD TYPE CHANGE
================================================== */

function childTypeChanged(select){

const div =
select.closest(".child");

updateChildNames(div);

}


/* ==================================================
   CHILD NAME CHANGE
================================================== */

function childNameChanged(select){

const div =
select.closest(".child");

const axisField =
div.querySelector(
".axisField"
);


if(
document.getElementById(
"machineType"
).value==="CNC" &&
select.value==="Axis"
){

axisField.classList.remove(
"hidden"
);

}else{

axisField.classList.add(
"hidden"
);

div.querySelector(
".childAxis"
).value="";

}

}


/* ==================================================
   SAVE MAINTENANCE
================================================== */

async function saveMaintenance(){

if(!currentMachineLoaded){

alert(
"Please load Asset Number first."
);

return;

}


const asset =
document.getElementById(
"assetNumber"
).value.trim();


const machineType =
document.getElementById(
"machineType"
).value;


if(!asset){

alert(
"Please load Asset Number first."
);

return;

}


if(!machineType){

alert(
"Please select Machine Type."
);

return;

}


/* ==================================================
   VALIDATE MACHINE
================================================== */

const commonFields=[
"machineName",
"manufacturer",
"powerRating",
"voltage"
];


for(
const id of commonFields
){

if(
!document.getElementById(
id
).value.trim()
){

alert(
"Please complete all required machine information."
);

document.getElementById(id).focus();

return;

}

}


if(machineType==="CNC"){

const cncFields=[
"year",
"controller",
"cncControl",
"serialNumber"
];


for(
const id of cncFields
){

if(
!document.getElementById(
id
).value.trim()
){

alert(
"Please complete all required CNC information."
);

document.getElementById(id).focus();

return;

}

}

}


/* ==================================================
   CHILD VALIDATION
================================================== */

const childDivs =
document.querySelectorAll(
".child"
);


if(childDivs.length===0){

alert(
machineType==="CNC"
?
"CNC machine requires at least one Child Asset."
:
"Conventional machine requires at least one Motor."
);

return;

}


const children=[];


for(
const div of childDivs
){

const childType =
div.querySelector(
".childType"
).value;


const childName =
div.querySelector(
".childName"
).value;


const axis =
div.querySelector(
".childAxis"
).value;


if(!childType){

alert(
"Please select Child Asset Type."
);

return;

}


if(!childName){

alert(
"Please select Child Asset Name."
);

return;

}


if(
machineType==="CNC" &&
childName==="Axis" &&
!axis
){

alert(
"Please select Axis."
);

return;

}


children.push({

childAssetType:
childType,

childAssetName:
childName,

axis:
axis

});

}


/* ==================================================
   MACHINE OBJECT
================================================== */

const machine={

machineName:
get("machineName"),

assetNumber:
asset,

machineBrand:"",

machineModel:"",

machineType:
machineType,

manufacturer:
get("manufacturer"),

year:
get("year"),

controller:
get("controller"),

cncControl:
get("cncControl"),

powerRating:
get("powerRating"),

voltage:
get("voltage"),

phase:"",

serialNumber:
get("serialNumber"),

machineFunction:"",

installationLocation:"",

departmentProductionLine:
get("departmentProductionLine"),

remarks:""

};


/* ==================================================
   SAVE
================================================== */

document.getElementById(
"msg"
).innerHTML=
"⏳ Saving...";


const saveButton =
document.querySelector(
".save"
);

saveButton.disabled=true;


try{

const result =
await api({

action:"saveMaintenance",

token:token,

machine:machine,

children:children

});


console.log(
"Save Result:",
result
);


if(result.success){

document.getElementById(
"msg"
).innerHTML=
"✅ " +
(result.message ||
"Machine data saved successfully.");

}else{

document.getElementById(
"msg"
).innerHTML=
"❌ " +
(result.message ||
"Save failed.");

}

}catch(e){

console.error(
"Save Error:",
e
);

document.getElementById(
"msg"
).innerHTML=
"❌ Connection error.";

}finally{

saveButton.disabled=false;

}

}


/* ==================================================
   GET VALUE
================================================== */

function get(id){

return document
.getElementById(id)
.value.trim();

}


/* ==================================================
   SET VALUE
================================================== */

function setVal(
id,
value
){

const el =
document.getElementById(id);

if(el){

el.value =
value || "";

}

}


/* ==================================================
   ESCAPE
================================================== */

function escapeHtml(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}
