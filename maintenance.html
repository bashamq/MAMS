<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Maintenance Entry</title>

<style>

*{box-sizing:border-box}

body{
margin:0;
font-family:Arial;
background:#f8fafc;
color:#0f172a
}

.header{
background:
linear-gradient(
135deg,#111827,#0f766e
);
color:white;
padding:20px;
text-align:center
}

.container{
max-width:1100px;
margin:auto;
padding:20px
}

.card{
background:white;
padding:22px;
border-radius:18px;
margin-bottom:20px;
box-shadow:0 8px 25px rgba(0,0,0,.07)
}

.grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(230px,1fr));
gap:15px
}

label{
font-weight:bold;
display:block;
margin-bottom:6px
}

input,select,textarea{
width:100%;
padding:12px;
border:1px solid #cbd5e1;
border-radius:9px
}

textarea{
min-height:80px
}

.child{
border:2px solid #dbeafe;
background:#f8fbff;
padding:18px;
border-radius:15px;
margin-top:15px;
position:relative
}

.childTitle{
font-weight:bold;
font-size:18px;
margin-bottom:15px
}

.remove{
background:#ef4444;
color:white;
border:0;
padding:8px 12px;
border-radius:8px;
position:absolute;
right:15px;
top:15px
}

.add{
background:#2563eb;
color:white;
border:0;
padding:13px 18px;
border-radius:10px;
margin-top:15px
}

.save{
background:#16a34a;
color:white;
border:0;
padding:15px;
border-radius:10px;
width:100%;
font-size:17px;
font-weight:bold
}

.back{
background:#64748b;
color:white;
border:0;
padding:10px 15px;
border-radius:8px;
margin-bottom:15px
}

.info{
background:#eff6ff;
padding:15px;
border-radius:12px;
margin-bottom:15px
}

#msg{
text-align:center;
font-weight:bold;
margin:15px
}


.fieldCONV{display:none}
.requiredChild{border:2px solid #ef4444 !important;background:#fff7f7 !important}
.requiredMark{color:#dc2626;font-weight:bold}
.axisWrap{display:none}
</style>

</head>

<body>

<div class="header">

<h1>🔧 Maintenance Technical Entry</h1>

</div>

<div class="container">

<button class="back"
onclick="location.href='home.html'">
⬅️ Back
</button>


<div class="card">

<h2>🔎 Find Machine</h2>

<div class="grid">

<div>

<label>Asset Number *</label>

<input id="searchAsset">

</div>

<div style="display:flex;align-items:end">

<button class="add"
onclick="loadMachine()">

🔍 Load Machine

</button>

</div>

</div>

<div id="productionInfo"></div>

</div>


<div class="card">

<h2>⚙️ Machine Technical Information</h2>

<div class="info" id="typeInfo">
پہلے Machine Type منتخب کریں۔
</div>

<div class="grid">

<div>
<label>Asset Number</label>
<input id="assetNumber" readonly>
</div>

<div>
<label>Machine Type <span class="requiredMark">*</span></label>
<select id="machineType" onchange="updateMachineType()">
<option value="">Select Type</option>
<option value="CNC">CNC</option>
<option value="Conventional">Conventional</option>
</select>
</div>

<!-- CNC -->
<div class="fieldCNC">
<label>Machine Name</label>
<input id="machineName">
</div>

<div class="fieldCNC">
<label>Manufacturer</label>
<input id="manufacturer">
</div>

<div class="fieldCNC">
<label>Year</label>
<input id="year" type="number">
</div>

<div class="fieldCNC">
<label>Controller</label>
<input id="controller">
</div>

<div class="fieldCNC">
<label>CNC Control</label>
<input id="cncControl">
</div>

<div class="fieldCNC">
<label>Power Rating</label>
<input id="powerRating">
</div>

<div class="fieldCNC">
<label>Voltage</label>
<input id="voltage">
</div>

<div class="fieldCNC">
<label>Serial Number</label>
<input id="serialNumber">
</div>

<div class="fieldCNC">
<label>Department / Production Line</label>
<input id="departmentProductionLine" readonly>
</div>

<!-- Conventional -->
<div class="fieldCONV">
<label>Machine Name</label>
<input id="convMachineName">
</div>

<div class="fieldCONV">
<label>Manufacturer</label>
<input id="convManufacturer">
</div>

<div class="fieldCONV">
<label>Controller</label>
<input id="convController">
</div>

<div class="fieldCONV">
<label>Power Rating</label>
<input id="convPowerRating">
</div>

<div class="fieldCONV">
<label>Voltage</label>
<input id="convVoltage">
</div>

<div class="fieldCONV">
<label>Serial Number</label>
<input id="convSerialNumber">
</div>

</div>

</div>


<div class="card" id="childCard">

<h2>🔩 Child Assets</h2>

<div class="info" id="childInfo">
Machine Type منتخب کرنے کے بعد Child Asset entry ظاہر ہوگی۔
</div>

<div id="children"></div>

<button class="add" id="addChildBtn" onclick="addChild()" style="display:none">
➕ Add Child Asset
</button>

</div>


<button class="save"
onclick="saveMaintenance()">

💾 Save Complete Machine Data

</button>

<div id="msg"></div>

</div>


<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbxop4TOck0v3KRllP6qJpNOLqpxyKAzw5YG43IP-lZEVHy_MChTn12RAdFfC_J9qysLsA/exec";

const token=sessionStorage.getItem("machine_token");
const user=JSON.parse(sessionStorage.getItem("machine_user")||"null");

if(!token || !user ||
(!user.maintenance && user.role!=="Administrator")){
location.href="index.html";
}


/* API */
async function api(data){

const response=await fetch(API_URL,{
method:"POST",
headers:{"Content-Type":"text/plain;charset=utf-8"},
body:JSON.stringify(data),
redirect:"follow"
});

if(!response.ok) throw new Error("HTTP Error: "+response.status);

const raw=await response.text();
console.log("API:",raw);

return JSON.parse(raw);
}


/* LOAD MACHINE */
async function loadMachine(){

const asset=document.getElementById("searchAsset").value.trim();

if(!asset){
alert("⚠️ Enter Asset Number.");
return;
}

document.getElementById("msg").innerHTML="⏳ Loading machine...";

try{

const result=await api({
action:"getMachine",
token:token,
assetNumber:asset
});

console.log("getMachine:",result);

if(!result.success){
document.getElementById("msg").innerHTML="❌ "+(result.message||"Machine not found.");
return;
}

document.getElementById("assetNumber").value=asset;


/* Production data */
let pHTML="";

if(result.production && result.production.length){

pHTML="<div class='info'><b>🏭 Production Information</b><br><br>";

result.production.forEach(p=>{

pHTML+=
"Shop: "+(p.machineShop||"-")+
" | Line: "+(p.productionLine||"-")+
" | Location: "+(p.machineLocation||"-")+
"<br>Part: "+(p.partName||"-")+
" | Operation: "+(p.operationProcess||"-")+
" | CT: "+(p.ctCycleTime||"-")+
"<br>";

});

pHTML+="</div>";

}else{

pHTML="<div class='info'>⚠️ No Production data found for this Asset Number.</div>";

}

document.getElementById("productionInfo").innerHTML=pHTML;


/* Production Line comes automatically from Production Data */
if(result.production && result.production.length){

document.getElementById("departmentProductionLine").value=
result.production[0].productionLine||"";

}


/* Existing machine */
if(result.machine){

const m=result.machine;

setVal("machineName",m.machineName);
setVal("manufacturer",m.manufacturer);
setVal("year",m.year);
setVal("controller",m.controller);
setVal("cncControl",m.cncControl);
setVal("powerRating",m.powerRating);
setVal("voltage",m.voltage);
setVal("serialNumber",m.serialNumber);

setVal("convMachineName",m.machineName);
setVal("convManufacturer",m.manufacturer);
setVal("convController",m.controller);
setVal("convPowerRating",m.powerRating);
setVal("convVoltage",m.voltage);
setVal("convSerialNumber",m.serialNumber);

if(m.machineType)
document.getElementById("machineType").value=m.machineType;

}else{
document.getElementById("machineType").value="";
}

updateMachineType();


/* Existing children */
document.getElementById("children").innerHTML="";

if(result.children && result.children.length){
result.children.forEach(c=>addChild(c));
}

document.getElementById("msg").innerHTML=
"✅ Machine loaded. Please select/check Machine Type.";

}catch(e){

console.error(e);

document.getElementById("msg").innerHTML=
"❌ Connection error. Please check Google Apps Script API.";

}

}


/* MACHINE TYPE */
function updateMachineType(){

const type=document.getElementById("machineType").value;

document.querySelectorAll(".fieldCNC").forEach(el=>{
el.style.display=type==="CNC"?"block":"none";
});

document.querySelectorAll(".fieldCONV").forEach(el=>{
el.style.display=type==="Conventional"?"block":"none";
});

const info=document.getElementById("typeInfo");
const childInfo=document.getElementById("childInfo");
const btn=document.getElementById("addChildBtn");

if(type==="CNC"){

info.innerHTML=
"🟢 <b>CNC:</b> Machine Name, Manufacturer, Year, Controller, CNC Control, Power Rating, Voltage اور Serial Number درج کریں۔ Department / Production Line خود Production Data سے آئے گی۔";

childInfo.innerHTML=
"🔴 <b>CNC Child Asset Required:</b> کم از کم ایک Motor یا Drive لازمی شامل کریں۔";

btn.style.display="inline-block";

}else if(type==="Conventional"){

info.innerHTML=
"🟠 <b>Conventional:</b> صرف Machine Name, Manufacturer, Controller, Power Rating, Voltage اور Serial Number درج کریں۔";

childInfo.innerHTML=
"🔴 <b>Conventional Child Asset Required:</b> Motor اور اس کا حصہ لازمی منتخب کریں۔";

btn.style.display="inline-block";

}else{

info.innerHTML="پہلے Machine Type منتخب کریں۔";
childInfo.innerHTML="Machine Type منتخب کریں۔";
btn.style.display="none";

}

}


/* CHILD ASSET */
function addChild(data={}){

const machineType=document.getElementById("machineType").value;

if(!machineType){
alert("⚠️ پہلے Machine Type منتخب کریں۔");
return;
}

const div=document.createElement("div");
div.className="child requiredChild";

let typeOptions;

if(machineType==="CNC"){
typeOptions=`
<option value="">Select Type</option>
<option value="Motor">Motor</option>
<option value="Drive">Drive</option>`;
}else{
typeOptions=`
<option value="">Select Type</option>
<option value="Motor">Motor</option>`;
}

div.innerHTML=`

<button class="remove" onclick="this.parentElement.remove()">✖</button>

<div class="childTitle">
🔩 ${machineType} Child Asset
<span class="requiredMark">*</span>
</div>

<div class="grid">

<div>
<label>Child Asset Type <span class="requiredMark">*</span></label>
<select class="childType" onchange="updateChildName(this)">
${typeOptions}
</select>
</div>

<div>
<label>Child Asset Name <span class="requiredMark">*</span></label>
<select class="childName" onchange="updateAxisVisibility(this)">
<option value="">Select Part</option>
</select>
</div>

<div class="axisWrap">
<label>Axis <span class="requiredMark">*</span></label>
<select class="childAxis">
<option value="">Select Axis</option>
<option value="X Axis">X Axis</option>
<option value="Y Axis">Y Axis</option>
<option value="Z Axis">Z Axis</option>
<option value="4th Axis">4th Axis</option>
<option value="5th Axis">5th Axis</option>
</select>
</div>

</div>
`;

document.getElementById("children").appendChild(div);

const typeSelect=div.querySelector(".childType");
typeSelect.value=data.childAssetType||"";

updateChildName(
typeSelect,
data.childAssetName||"",
data.axis||""
);

}


/* CHILD NAME */
function updateChildName(select,oldName="",oldAxis=""){

const div=select.closest(".child");
const machineType=document.getElementById("machineType").value;
const childType=select.value;
const nameSelect=div.querySelector(".childName");

nameSelect.innerHTML='<option value="">Select Part</option>';

let names=[];

if(machineType==="CNC"){
if(childType==="Motor" || childType==="Drive"){
names=["Spindle","Axis","ATC","Tool Turret"];
}
}else if(machineType==="Conventional"){
if(childType==="Motor"){
names=["Spindle","Axis"];
}
}

names.forEach(name=>{

const opt=document.createElement("option");
opt.value=name;
opt.textContent=name;

if(name===oldName) opt.selected=true;

nameSelect.appendChild(opt);

});

updateAxisVisibility(nameSelect,oldAxis);

}


/* AXIS */
function updateAxisVisibility(select,oldAxis=""){

const div=select.closest(".child");
const wrap=div.querySelector(".axisWrap");
const axis=div.querySelector(".childAxis");

if(select.value==="Axis"){

wrap.style.display="block";

if(oldAxis) axis.value=oldAxis;

}else{

wrap.style.display="none";
axis.value="";

}

}


/* VALIDATION */
function validateChildren(type){

const children=document.querySelectorAll(".child");

if(children.length===0){

alert(
"⚠️ "+type+
" machine کے لیے Child Asset لازمی ہے۔"
);

return false;
}

for(const div of children){

const t=div.querySelector(".childType").value;
const n=div.querySelector(".childName").value;
const a=div.querySelector(".childAxis").value;

if(!t || !n){

alert("⚠️ ہر Child Asset میں Type اور Part لازمی منتخب کریں۔");
return false;
}

if(n==="Axis" && !a){

alert("⚠️ Axis منتخب کیا گیا ہے۔ X, Y, Z, 4th یا 5th Axis منتخب کریں۔");
return false;
}

}

return true;
}


/* SAVE */
async function saveMaintenance(){

const asset=document.getElementById("assetNumber").value.trim();
const machineType=document.getElementById("machineType").value;

if(!asset){
alert("⚠️ Please load Asset Number first.");
return;
}

if(!machineType){
alert("⚠️ Please select Machine Type.");
return;
}

if(!validateChildren(machineType)) return;


let machine;

if(machineType==="CNC"){

machine={
machineName:get("machineName"),
assetNumber:asset,
machineBrand:"",
machineModel:"",
machineType:"CNC",
manufacturer:get("manufacturer"),
year:get("year"),
controller:get("controller"),
cncControl:get("cncControl"),
powerRating:get("powerRating"),
voltage:get("voltage"),
phase:"",
serialNumber:get("serialNumber"),
machineFunction:"",
installationLocation:"",
departmentProductionLine:get("departmentProductionLine"),
remarks:""
};

}else{

machine={
machineName:get("convMachineName"),
assetNumber:asset,
machineBrand:"",
machineModel:"",
machineType:"Conventional",
manufacturer:get("convManufacturer"),
year:"",
controller:get("convController"),
cncControl:"",
powerRating:get("convPowerRating"),
voltage:get("convVoltage"),
phase:"",
serialNumber:get("convSerialNumber"),
machineFunction:"",
installationLocation:"",
departmentProductionLine:get("departmentProductionLine"),
remarks:""
};

}


const children=[];

document.querySelectorAll(".child").forEach(div=>{

children.push({

childAssetType:div.querySelector(".childType").value,
childAssetName:div.querySelector(".childName").value,
axis:div.querySelector(".childAxis").value,

brand:"",
model:"",
serialNumber:"",
partNumber:"",
locationOnMachine:"",
voltage:"",
current:"",
power:"",
function:"",
condition:"Working",
remarks:""

});

});


document.getElementById("msg").innerHTML="⏳ Saving...";

try{

const result=await api({
action:"saveMaintenance",
token:token,
machine:machine,
children:children
});

console.log("saveMaintenance:",result);

if(result.success){

document.getElementById("msg").innerHTML=
"✅ "+result.message+
" | Child Assets: "+(result.childCount||children.length);

}else{

document.getElementById("msg").innerHTML=
"❌ "+(result.message||"Save failed.");

}

}catch(e){

console.error(e);

document.getElementById("msg").innerHTML=
"❌ Connection error.";

}

}


/* HELPERS */
function setVal(id,value){

const el=document.getElementById(id);
if(el) el.value=value||"";

}

function get(id){

const el=document.getElementById(id);
return el ? el.value : "";

}

function escapeHtml(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function escapeAttr(value){
return escapeHtml(value);
}

updateMachineType();


</script>

</body>
</html>
